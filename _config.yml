title: VMV 的博客
subtitle: ''
description: VMV的个人技术博客，专注CTF、网络安全、漏洞分析、AI大模型、Linux运维、编程开发等领域的技术分享与实战记录
keywords: VMV,博客,技术博客,CTF,网络安全,漏洞分析,Web安全,Pwn,Reverse,密码学,AI,大模型,Linux,运维,编程
author: VMV
language: zh-CN
timezone: Asia/Shanghai

url: https://TSVMV.github.io
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: true
  trailing_html: true

new_post_name: :title.md
default_layout: post
external_link:
  enable: true
  field: site
  exclude: ''
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
meta_generator: false
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'
per_page: 10
pagination_dir: page

theme: butterfly

search:
  path: search.xml
  field: post
  content: true
  format: html

sitemap:
  path: sitemap.xml
  rel: false

feed:
  type: atom
  path: atom.xml
  limit: 20
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

deploy:
  type: ''

html_minifier:
  enable: true
  exclude:
    - '**/downloads/**'
  collapseBooleanAttributes: true
  collapseWhitespace: true
  ignoreCustomComments:
    - '^\s*more'
  removeComments: true
  removeEmptyAttributes: true
  removeScriptTypeAttributes: true
  removeStyleLinkTypeAttributes: true
  minifyJS: true
  minifyCSS: true
